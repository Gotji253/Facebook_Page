name: Football video draft

on:
  schedule:
    - cron: "0 0,3,5,8,11,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-video-draft
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check ffmpeg
        run: ffmpeg -version | head -1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$HF_TOKEN" ]; then echo "Need OPENAI_API_KEY or GEMINI_API_KEY or HF_TOKEN"; exit 1; fi
          test -n "$FB_PAGE_ID" || { echo "Missing FB_PAGE_ID secret"; exit 1; }
          test -n "$FB_PAGE_TOKEN" || { echo "Missing FB_PAGE_TOKEN secret"; exit 1; }

      - name: Probe Gemini API key
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python check_gemini.py

      - name: Probe Hugging Face image generation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_IMAGE_MODEL: Tongyi-MAI/Z-Image-Turbo
        run: python check_hf_image.py

      - name: Create video and post to Facebook
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_CHAT_MODEL: HuggingFaceTB/SmolLM3-3B
          HF_IMAGE_MODEL: Tongyi-MAI/Z-Image-Turbo
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FONT_PATH: ${{ github.workspace }}/fonts/NotoSansThai-Regular.ttf
          VIDEO_DRAFT_DIR: video_drafts
          VIDEO_STATE_FILE: video_draft_state.json
          POST_TO_FACEBOOK: "1"
        run: python video_post.py

      - name: Upload draft artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-video-draft-${{ github.run_id }}
          path: |
            hf_test.png
            video_drafts/*.mp4
            video_drafts/*.json
            video_drafts/scenes_*/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist draft state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f video_draft_state.json ]; then
            git add -f video_draft_state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update video draft state"
              git push
            else
              echo "video_draft_state.json is unchanged"
            fi
          fi
